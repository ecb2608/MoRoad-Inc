<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">
   
<style>
    /* ============================================================
       1. ELIMINACIÓN RADICAL DE CABECERAS (CUADRO GRIS)
       ============================================================ */
    /* Estas líneas buscan cualquier rastro del diseño original de Upnify y lo borran */
    #salesUpForm-1 .sp-form-header, 
    #salesUpForm-1 .panel-heading, 
    #salesUpForm-1 .panel-title, 
    #salesUpForm-1 header,
    #salesUpForm-1 div[class*="header"],
    #salesUpForm-1 div[class*="heading"] {
        display: none !important;      /* Oculta el elementos del diseño visual completamente */
        height: 0 !important;        /* Asegura que no ocupe espacio vertical */
        margin: 0 !important;        /* Quita espacios exteriores */
        padding: 0 !important;       /* Quita espacios interiores */
        border: none !important;      /* Elimina cualquier línea de borde */
    }

    /* Quita el borde y la sombra que Upnify le pone al recuadro interno */
    /* Limpiamos el contenedor "Panel" que Upnify trae por defecto para que sea invisible */
    #salesUpForm-1 .panel, 
    #salesUpForm-1 .sp-form-container {
        border: none !important;   /* Quita el borde gris del cuadro original */
        box-shadow: none !important;    /* Quita la sombra predeterminada de Upnify */
        background: transparent !important; /* Hace que el fondo de Upnify sea invisible */
    }

    /* ============================================================
       2. CONFIGURACIÓN DEL CUERPO (BACKGROUND)
       ============================================================ */
    /* NOTA: Si no ves el color aquí, es porque el Iframe en tu index.html 
       podría tener su propio color de fondo que lo tapa. */
    body { 
        margin: 0; 
        padding: 30px 15px; 
        font-family: 'Roboto', sans-serif; 
        background-color: #f4f7f9 !important; /* <--- CAMBIA ESTE COLOR para el fondo fuera de la tarjeta */
        display: flex;             /* Activa el modo de alineación */
        justify-content: center;   /* Centra la tarjeta horizontalmente */
    }

    /* ============================================================
       3. DISEÑO DE TARJETA (LA "CARD" BLANCA)
       ============================================================ */
    /* Este es el contenedor que creamos para que el formulario parezca una tarjeta moderna */

    #salesUpForm-1 {
        background-color: #ffffff !important; /* Color de fondo de la tarjeta */
        padding: 40px !important;            /* Espacio entre el borde y los campos */
        border-radius: 12px !important;      /* Redondeo de las esquinas */
        box-shadow: 0 12px 35px rgba(0,0,0,0.1) !important; /* Sombra para dar profundidad */
        width: 100% !important;              /* Se adapta al ancho disponible */
        max-width: 500px !important;         /* No permite que sea más ancha de 500px */
        border-top: 6px solid rgb(15, 99, 167) !important; /* La línea azul superior */
        box-sizing: border-box !important;   /* Asegura que el padding no afecte el ancho total */
    }

    /* ============================================================
       4. ESTILO DE ETIQUETAS (NOMBRES DE LOS CAMPOS)
       ============================================================ */
    #salesUpForm-1 label {
        font-weight: 700 !important;         /* Pone el texto en negrita */
        color: #333 !important;              /* Color del texto */
        font-size: 12px !important;          /* Tamaño de la letra */
        text-transform: uppercase !important; /* Convierte todo a MAYÚSCULAS */
        letter-spacing: 1px !important;      /* Espacio entre letras */
        margin-bottom: 8px !important;       /* Separación con el campo de abajo */
        display: block !important;           /* Hace que ocupe toda la línea */
    }

    /* ============================================================
       5. CAMPOS E INPUTS (DONDE ESCRIBE EL USUARIO)
       ============================================================ */
    #salesUpForm-1 input, 
    #salesUpForm-1 select {
        width: 100% !important;              /* Ancho completo */
        height: 48px !important;             /* Altura del campo */
        padding: 10px 15px !important;       /* Espacio del texto interno */
        margin-bottom: 20px !important;      /* Espacio entre un campo y el siguiente */
        border: 1px solid #ddd !important;   /* Borde gris claro */
        border-radius: 6px !important;       /* Redondeo suave de los campos */
        font-size: 15px !important;          /* Tamaño del texto que escribe el usuario */
        background-color: #fcfcfc !important; /* Color de fondo del campo */
        box-sizing: border-box !important;  /* Evita que el campo se salga de la tarjeta */
    }

    /* ------------------------------------------------------------
       ESTADO FOCUS (AL DAR CLIC): CAMBIO DE BORDE Y SOMBREADO (GLOW)
       ------------------------------------------------------------ */
    #salesUpForm-1 input:focus, 
    #salesUpForm-1 select:focus {
        border-color: rgb(15, 167, 114) !important; /* El borde cambia a azul */
        background-color: #fff !important;         /* El fondo se vuelve blanco puro */
        outline: none !important;                  /* Quita el borde amarillo de Chrome */
    /* EL SOMBREADO : 
           0 0 0 -> Posición X, Y y Difuminado.
           3px -> Es el grosor del "aura" o sombreado.
           rgba(15, 99, 167, 0.1) -> El color azul con un 10% de opacidad.
           PARA QUITARLO: Cambia la línea de abajo por: box-shadow: none !important; */
        box-shadow: 0 0 0 3px rgba(12, 174, 45, 0.1) !important;
    
    
    }

    /* ============================================================
       6. BOTÓN PERSONALIZADO Y HOVER (Interacción)
       ============================================================ */
    /* Aplicamos el estilo al botón en todos sus estados posibles */
    #salesUpForm-1 .btn-prospecto, 
    #salesUpForm-1 button, 
    #salesUpForm-1 input[type="submit"] {
        background-color: transparent !important;   /* Fondo transparente inicial */
        background-image: none !important;          /* Quita degradados de Upnify */
        border: 2px solid rgb(15, 99, 197) !important; /* Borde azul */
        color: rgb(15, 99, 167) !important;         /* Texto azul */
        padding: 12px 45px !important;              /* Tamaño del botón */
        border-radius: 200px !important;            /* Forma de cápsula/circular */
        font-weight: 700 !important;                /* Texto en negrita */
        text-transform: uppercase !important;       /* Texto en MAYÚSCULAS */
        cursor: pointer !important;                 /* Cambia el cursor a "manita" */
        display: block !important;                  /* Permite centrar el botón */
        margin: 20px auto 0 auto !important;        /* Centrado horizontal */
        transition: all 0.3s ease-in-out !important; /* Animación suave para el hover */
        width: auto !important;                     /* El ancho depende del texto */
    }

    /* ESTADO HOVER: Se activa al pasar el mouse */
    /* He añadido selectores más específicos para que no deje de funcionar */
    #salesUpForm-1 .btn-prospecto:hover, 
    #salesUpForm-1 button:hover, 
    #salesUpForm-1 input[type="submit"]:hover {
        background-color: rgb(15, 99, 167) !important; /* El fondo se vuelve azul */
        color: #ffffff !important;                    /* El texto se vuelve blanco */
        transform: translateY(-2px) !important;       /* El botón sube un poquito */
        box-shadow: 0 5px 15px rgba(15, 99, 167, 0.4) !important; /* Sombra azul brillante */
    }

    /* ============================================================
   7. ESTILO DE LA TARJETA DE ÉXITO (LOGO Y TIPOGRAFÍA)
   ============================================================ */
#custom-success-card {
    position: absolute; /* Coloca el mensaje sobre el formulario sin mover nada */
    top: 0; left: 0;
    width: 100%; height: 100%;
    
    /* FONDO Y BLUR: Fondo blanco casi opaco (0.9) con efecto de desenfoque */
    background-color: rgba(255, 255, 255, 0.9) !important; 
    backdrop-filter: blur(8px); /* Crea el efecto de vidrio borroso */
    -webkit-backdrop-filter: blur(8px); /* Compatibilidad para navegadores Safari/iOS */
    
    z-index: 100; /* Asegura que el mensaje tape los campos del formulario */
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; /* Redondeo de esquinas para que encaje en tu tarjeta */
    transition: opacity 0.5s ease-in-out; /* Fundido suave al aparecer */
}

/* --- ANIMACIÓN DEL LOGO --- */
.success-icon { 
    margin-bottom: 25px; /* Espacio entre el logo y el título */
    display: inline-block; /* Permite que el logo se mueva correctamente */
    
    /* Animación "bounceLogo": 0.8s de duración, movimiento infinito y alternado */
    animation: bounceLogo 1s ease-in-out infinite alternate;
}

/* Definimos el movimiento del logo (sube y baja ligeramente) */
@keyframes bounceLogo {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); } /* Sube 8 píxeles */
}

/* --- CONTROL DE TIPOGRAFÍA DE LOS MENSAJES --- */
.card-content h2 { 
    /* Cambia aquí la fuente, tamaño y color del Título */
    font-family: 'Roboto', sans-serif; /* Puedes poner la fuente de tu web aquí */
    color: rgb(15, 99, 167); /* Color azul Motorcycles Road Inc. */
    font-size: 24px; /* Tamaño del título */
    font-weight: 900; /* Grosor de la letra (muy negrita) */
    margin: 0 0 10px 0; /* Margen inferior para separar del párrafo */
    text-transform: uppercase; /* Fuerza el título a mayúsculas */
    letter-spacing: 1.5px; /* Espaciado entre letras para un look moderno */
}

.card-content p { 
    /* Cambia aquí la fuente y estilo del mensaje descriptivo */
    font-family: 'Roboto', sans-serif;
    color: #444444; /* Color gris oscuro para lectura fácil */
    font-size: 16px; /* Tamaño del texto */
    line-height: 1.6; /* Altura de línea para que el texto no esté amontonado */
    font-weight: 400; /* Grosor normal */
    margin: 0; /* Sin márgenes extra */
}

/* --- CONTROL DE VISIBILIDAD --- */
.success-hidden { 
    opacity: 0; 
    visibility: hidden; 
    pointer-events: none; /* Inhabilita clics mientras está oculto */
}

.success-visible { 
    opacity: 1 !important; 
    visibility: visible !important; 
    pointer-events: all !important; /* Habilita clics cuando se muestra */
}

/* --- BARRA DE PROGRESO --- */
.progress-container {
    width: 70%; /* Ancho de la barra respecto a la tarjeta */
    background: #e0e0e0; /* Color gris de fondo de la barra */
    height: 4px; /* Grosor de la barra */
    margin: 25px auto 0 auto; /* Centrado y separación superior */
    border-radius: 10px; 
    overflow: hidden; /* Corta el color azul cuando se llena */
}

.progress-bar {
    height: 100%; 
    background: rgb(15, 99, 167); /* Color azul que se va llenando */
    width: 0%; /* Inicia vacía */
}

/* --- BOTÓN DE CERRAR DENTRO DE LA TARJETA --- */
#close-success {
    position: absolute; /* Se ubica de forma independiente dentro de la tarjeta */
    top: 15px;          /* Distancia desde el borde superior */
    right: 15px;        /* Distancia desde el borde derecho */
    background: none;   /* Sin fondo */
    border: none;       /* Sin bordes */
    font-size: 28px;    /* Tamaño de la 'X' */
    color: #999;        /* Color gris suave inicial */
    cursor: pointer;    /* Cambia el cursor a mano al pasar encima */
    line-height: 1;     /* Ajusta la altura para que la X esté centrada */
    transition: color 0.3s ease, transform 0.3s ease; /* Animación suave */
    z-index: 101;       /* Por encima del contenido del mensaje */
}

/* Efecto al pasar el mouse por el botón de cerrar */
#close-success:hover {
    color: rgb(15, 99, 167); /* Cambia al azul de tu marca */
    transform: scale(1.2);    /* Crece un poquito para indicar que es clickeable */
}

/* Ajuste al contenedor padre para que el botón se posicione correctamente */
#custom-success-card {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: white !important; /* Fondo sólido para tapar todo */
    display: flex !important; /* Forza el centrado */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
}

</style>
</head>
<body>
    <div class="card-form" style="position: relative; overflow: hidden;"> 
        <script>
            (function () { var _sp = window._sp || (window._sp = []); if (!_sp.loaded) { var sps = document.createElement('script'); sps.async = true; sps.src = 'https://assets.upnify.com/scripts/forms/js/spf.js'; var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(sps, s); _sp.loaded = true; } })(); window._sp = window._sp || [] ; _sp.addForm = function(config){window._sp.push(config)};
            _sp.addForm({ 'formId': 'eyJlIjoiMTE2NzM1IiwidCI6IlAyNUM1NDY3M0ExLUQyQTEtNDY0Ri04NUE5LTE5OTNCOTQ0RkFFQiJ9' }); 
        </script>
        
        <div id="salesUpForm-1"></div>

        <div id="custom-success-card" class="success-hidden" style="z-index: 999999 !important;">
            <button id="close-success" title="Cerrar">&times;</button>
            <div class="card-content">
                <div class="success-icon">
                    <img src="assets/images/logo.png" style="width: 80px; height: auto;" alt="Logo Motorcycles">
                </div>
                <h2>¡DATOS RECIBIDOS!</h2>
                <p>Gracias por contactar a <strong>Motorcycles Road Inc.</strong><br>
                En breve un asesor comercial se comunicará contigo.</p>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const formContainer = document.querySelector('#salesUpForm-1');
            const successCard = document.getElementById('custom-success-card');
            const progressBar = document.querySelector('.progress-bar');
            const closeBtn = document.getElementById('close-success');
            const duracionMensaje = 5000;
            let mensajeActivado = false;

            const finalizarYLimpiar = () => { window.location.reload(); };

            closeBtn.addEventListener('click', finalizarYLimpiar);

            // Observador global mejorado
            const observer = new MutationObserver(function(mutations) {
                if (mensajeActivado) return; // Evita que se ejecute varias veces

                // 1. Buscamos el letrero verde de Upnify por su clase o texto
                const toastUpnify = document.querySelector('.sp-toast, .sp-message-container');
                const textoExito = document.body.innerText.includes('Exito') || document.body.innerText.includes('enviados');

                if (toastUpnify || textoExito) {
                    mensajeActivado = true;

                    // A. OCULTAR TODO LO DE UPNIFY (Incluso el aviso verde)
                    if(toastUpnify) toastUpnify.style.display = 'none';
                    formContainer.style.visibility = 'hidden'; // Oculta el formulario original pero mantiene el espacio
                    
                    // B. MOSTRAR TU TARJETA
                    successCard.classList.remove('success-hidden');
                    successCard.classList.add('success-visible');
                    
                    // C. ANIMAR BARRA
                    progressBar.style.animation = `loadingBar ${duracionMensaje}ms linear forwards`;

                    // D. RECARGA AUTOMÁTICA
                    setTimeout(finalizarYLimpiar, duracionMensaje);
                }
            });

            // Vigilamos el body y el contenedor del formulario
            observer.observe(document.body, { childList: true, subtree: true });
        });
    </script>
</body>
</html>
